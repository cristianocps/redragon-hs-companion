# Redragon/XiiSound wireless headset fix (USB dongle family, Weltrend chipset)
# Forces PipeWire software mixer, locks hardware volume at 100% and hides the
# phantom digital interface. Fixes channel imbalance/mute-below-100% bug.
#
# Covers the 040b:0897 rebrand family (Redragon H878, H848, H510-PRO Wireless,
# Havit Fuxi-H3, etc.) plus name-based fallbacks for related dongles.
#
# Based on findings from issue #6 and the MIT-licensed reference
# github.com/cleisonsantos/havit-fuxi-h3-linux-fix (WP 0.4/0.5 compatible).
monitor.alsa.rules = [
  {
    matches = [
      {
        device.vendor.id = "0x040b"
        device.product.id = "0x0897"
      }
      {
        device.name = "~alsa_card.usb-XiiSound*"
      }
      {
        device.name = "~alsa_card.usb-Weltrend*"
      }
      {
        device.name = "~alsa_card.usb-*H878*"
      }
      {
        device.name = "~alsa_card.usb-*H848*"
      }
      {
        device.name = "~alsa_card.usb-*H510*"
      }
      {
        device.name = "~alsa_card.usb-*Fuxi*"
      }
      {
        device.name = "~alsa_card.usb-*Redragon*"
      }
      {
        device.name = "~alsa_card.usb-*2.4G*Wireless*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
        api.alsa.ignore-dB = true
        api.alsa.enable-hw-volume = false
        device.profile-set = "analog-only.conf"
      }
    }
  }
]
