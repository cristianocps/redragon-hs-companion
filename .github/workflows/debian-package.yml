name: Build Debian Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-deb:
    name: Build .deb package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg

      - name: Create package structure
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || VERSION="$(date +%Y.%m.%d)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          PKG="debian-package/redragon-volume-sync_${VERSION}"
          mkdir -p "$PKG/DEBIAN" \
                   "$PKG/usr/local/bin" \
                   "$PKG/usr/lib/systemd/user" \
                   "$PKG/usr/share/doc/redragon-volume-sync" \
                   "$PKG/usr/share/icons/hicolor/scalable/apps"

          # Scripts and daemons
          cp redragon_volume_sync.py "$PKG/usr/local/bin/"
          cp redragon_daemon.py "$PKG/usr/local/bin/"
          cp redragon_control_daemon.py "$PKG/usr/local/bin/"
          cp redragon-volume "$PKG/usr/local/bin/"
          cp redragon-lock-pcm.sh "$PKG/usr/local/bin/"
          chmod +x "$PKG/usr/local/bin/"*

          # Documentation and icon
          cp README.md LICENSE "$PKG/usr/share/doc/redragon-volume-sync/"
          cp icons/redragon-volume-sync.svg "$PKG/usr/share/icons/hicolor/scalable/apps/"

          # systemd user units (paths point at /usr/local/bin for the .deb layout)
          cat > "$PKG/usr/lib/systemd/user/redragon-volume-sync.service" <<EOF
          [Unit]
          Description=Redragon Wireless Headset Volume Synchronizer
          After=sound.target pulseaudio.service
          Wants=sound.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/redragon_daemon.py
          Restart=on-failure
          RestartSec=5
          StandardOutput=journal
          StandardError=journal

          NoNewPrivileges=true
          PrivateTmp=true

          [Install]
          WantedBy=default.target
          EOF

          cat > "$PKG/usr/lib/systemd/user/redragon-control-daemon.service" <<EOF
          [Unit]
          Description=Redragon Control Daemon - Volume Control Server
          After=sound.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/redragon_control_daemon.py
          Restart=on-failure
          RestartSec=5
          StandardOutput=journal
          StandardError=journal

          NoNewPrivileges=true
          PrivateTmp=true

          [Install]
          WantedBy=default.target
          EOF

      - name: Create control file
        run: |
          PKG="debian-package/redragon-volume-sync_${VERSION}"
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: redragon-volume-sync
          Version: ${VERSION}
          Section: sound
          Priority: optional
          Architecture: all
          Depends: python3, alsa-utils, systemd
          Recommends: pipewire | pulseaudio
          Maintainer: Redragon HS Companion Contributors
          Homepage: https://github.com/cristianocps/redragon-hs-companion
          Description: Volume control for Redragon wireless headsets on Linux
           Automatically syncs the volume channels of Redragon wireless
           headsets (H878, H848, H510, etc) on Linux.
           .
           Features:
            - CLI client for manual control (redragon-volume)
            - Automatic sync daemon with event monitoring
            - Fast control daemon over a Unix socket
            - GNOME Shell, Cinnamon, KDE Plasma and COSMIC widgets
            - Optional PipeWire configuration
          EOF

      - name: Create postinst script
        run: |
          PKG="debian-package/redragon-volume-sync_${VERSION}"
          cat > "$PKG/DEBIAN/postinst" <<'EOF'
          #!/bin/bash
          set -e

          # Create symlink
          ln -sf /usr/local/bin/redragon_volume_sync.py /usr/local/bin/redragon-sync || true

          echo "Redragon HS Companion instalado com sucesso!"
          echo ""
          echo "Para iniciar:"
          echo "  systemctl --user daemon-reload"
          echo "  systemctl --user enable --now redragon-volume-sync.service"
          echo "  systemctl --user enable --now redragon-control-daemon.service"
          echo ""
          echo "Comandos disponiveis:"
          echo "  redragon-sync status"
          echo "  redragon-volume 75"
          echo ""
          echo "Documentacao: /usr/share/doc/redragon-volume-sync/"
          EOF

          chmod 755 "$PKG/DEBIAN/postinst"

      - name: Build .deb package
        run: |
          dpkg-deb --build "debian-package/redragon-volume-sync_${VERSION}"
          mv "debian-package/redragon-volume-sync_${VERSION}.deb" "redragon-volume-sync_${VERSION}_all.deb"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: '*.deb'
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: '*.deb'
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
